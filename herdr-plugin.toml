id = "herdr-slack-plugin"
name = "Herdr Slack Bridge"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Drive your herdr agents from Slack: one thread per pane, several bots, handoffs between them. Zero-LLM bridge."
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "ci"]
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "run", "build"]
platforms = ["linux", "macos"]

[[actions]]
id = "bootstrap"
title = "Start daemon"
command = ["node", "dist/index.js", "--daemon"]

[[actions]]
id = "status"
title = "Daemon status"
command = ["node", "dist/index.js", "--status"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "dist/plugin.js"]
